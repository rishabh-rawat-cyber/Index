<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in</title>
    <script src="function.js"> </script>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            background: rgb(0, 0, 33);

        }

        .logo {
            background: rgb(0, 0, 33);
            height: 16cm;
            width: 40%;
            border: 2px solid white;
            margin-left: 30%;
            margin-top: 20px;
            border-radius: 6px;
            box-shadow: blue;
        }

        .lock-img svg {
            border: 1px solid white;
            margin-left: 40%;
            border-radius: 100px;
            color: blue;
            margin-top: 50px;

        }

        .lock-img span {
            color: white;
            font-size: 40px;
            margin-left: 30%;
        }

        .lock-img p {
            color: rgb(203, 201, 201);
            margin-left: 40%;

        }

        .lock-img label {
            color: white;
            margin-left: 10%;
        }

        .lock-img input {
            background: rgb(0, 0, 33);
            color: white;
            margin-left: 10%;
            height: 30px;
            width: 80%;
            border: 1px solid rgb(65, 64, 64);
            border-radius: 5px;
        }

        .lock-img input ::placeholder {
            margin-left: 40%;
        }

        .lock-img .Forgot {
            color: blue;
            margin-left: 75%;
            font-size: 15px;
            margin-top: 5%;
        }

        .lock-img button {
            background: rgb(20, 20, 225);
            color: white;
            height: 1.5cm;
            width: 90%;
            border: 1px solid white;
            border-radius: 5px;
            margin-left: 20px;
            font-size: 20px;
        }
              
        .link-icon {
            display: flex; 
            margin-left: 40%;
            margin-right: 75%;
            gap: 50px;
            justify-content: center;
            position: static;
            top: 1px;
        }
    </style>
</head>
